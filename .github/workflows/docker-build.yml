name: Docker Build & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  docker-build-verify:
    name: Multi-Stage Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Dev Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.backend
          target: dev
          push: false
          tags: raguard-backend:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend Production Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.backend.prod
          target: production
          push: false
          tags: raguard-backend:prod-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Dev Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend
          target: dev
          push: false
          tags: raguard-frontend:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Production Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend.prod
          target: production
          push: false
          tags: raguard-frontend:prod-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
