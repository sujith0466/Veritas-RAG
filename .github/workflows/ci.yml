name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install ruff==0.4.1 mypy==1.10.0

      - name: Lint (ruff)
        run: ruff check backend/ --output-format=github > ruff-report.txt || true

      - name: Type Check (mypy)
        run: mypy backend/ --ignore-missing-imports > mypy-report.txt || true

      - name: Upload Quality Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            ruff-report.txt
            mypy-report.txt
          retention-days: 14
          
      - name: Fail if Lint/Typecheck failed
        run: |
          ruff check backend/
          mypy backend/ --ignore-missing-imports

  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type Check (tsc)
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: raguard_test
          POSTGRES_USER: raguard
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install pytest-cov pytest-asyncio

      - name: Run Pytest
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://raguard:test@localhost:5432/raguard_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret
          QDRANT_URL: http://localhost:6333
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=xml --cov-fail-under=85

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.14.0

      - name: Build Backend Dev Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.backend
          target: dev
          push: false
          tags: raguard-backend:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit==1.7.8

      - name: Run Bandit
        run: bandit -r backend/ -ll -f json -o bandit-report.json || true

      - name: Upload Security Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 14
          
      - name: Fail if SAST failed
        run: bandit -r backend/ -ll

