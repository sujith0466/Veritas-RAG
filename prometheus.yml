global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'raguard-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000', 'backend:8000', 'localhost:8000']

  - job_name: 'raguard-qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
