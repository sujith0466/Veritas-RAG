groups:
  - name: raguard_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(raguard_http_errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate"
          description: "Over 5% of requests in the last 5 minutes resulted in 5xx errors."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(raguard_http_request_duration_seconds_bucket[5m])) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API Latency"
          description: "95th percentile latency is over 2 seconds."

      - alert: CircuitBreakerOpen
        expr: raguard_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit Breaker is OPEN"
          description: "LLM generation circuit breaker has tripped."
