events {
    worker_connections 1024;
}

http {
    upstream raguard_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name api.raguard.local;

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Allow health check without TLS for internal LB monitoring
        location /health {
            proxy_pass http://raguard_api/health;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.raguard.local;

        # Self-signed placeholder - replace via secrets manager
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        location / {
            proxy_pass http://raguard_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health/Readiness endpoints
        location /health/readiness {
            proxy_pass http://raguard_api/health/readiness;
        }
    }
}
