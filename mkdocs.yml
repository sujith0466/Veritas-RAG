site_name: Veritas RAG
site_description: Enterprise Knowledge Reliability Platform using Self-Correcting Retrieval-Augmented Generation
site_author: Veritas RAG Contributors
site_url: https://docs.veritas-rag.ai
repo_url: https://github.com/sujith0466/Veritas-RAG
repo_name: sujith0466/Veritas-RAG
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home:
    - Complete Project Handbook: VERITAS_RAG_COMPLETE_PROJECT_HANDBOOK.md
    - Documentation Index: DOCUMENTATION_INDEX.md
    - High-Level Architecture: Architecture/high-level-architecture.md
    - System Design: Architecture/SYSTEM_DESIGN.md
  - Architecture:
    - System Architecture: Architecture/ARCHITECTURE.md
    - Document Processing Pipeline: Architecture/DOCUMENT_PROCESSING.md
    - Hybrid Retrieval Strategy: Architecture/HYBRID_RETRIEVAL.md
    - Database Architecture: Architecture/DATABASE_ARCHITECTURE.md
    - Observability Architecture: Architecture/OBSERVABILITY_ARCHITECTURE.md
    - Security Architecture: Security/SECURITY_ARCHITECTURE.md
  - Operations & Guides:
    - User Guide: User/user-guide.md
    - Admin Guide: User/admin-guide.md
    - Deployment Guide: Operations/deployment-guide.md
    - Configuration Guide: Operations/CONFIGURATION_GUIDE.md
    - Monitoring & Observability: Operations/MONITORING.md
    - Troubleshooting Guide: User/troubleshooting-guide.md
    - Testing & Verification Guide: Validation/TESTING_GUIDE.md
  - API & References:
    - API Reference: API/API_REFERENCE.md
    - FAQ: User/faq.md
    - Feature Matrix: Portfolio/feature-matrix.md
    - Roadmap: Roadmap/ROADMAP.md
  - Community & Governance:
    - Code of Conduct: ../CODE_OF_CONDUCT.md
    - Contributing Guidelines: ../CONTRIBUTING.md
    - Security Policy: ../SECURITY.md
