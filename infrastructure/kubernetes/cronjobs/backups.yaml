apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: veritas-rag-production
  labels:
    app.kubernetes.io/name: veritas-rag
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: cronjob-backup
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-dump
            image: postgres:15-alpine
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-rag-secrets
                  key: POSTGRES_PASSWORD
            command:
            - /bin/sh
            - -c
            - "pg_dump -h raguard-postgres -U raguard raguard_db > /backup/db_$(date +%Y%m%d).sql"
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: veritas-rag-production
  labels:
    app.kubernetes.io/name: veritas-rag
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: cronjob-minio-backup
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: mc-mirror
            image: minio/mc:latest
            env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-rag-secrets
                  key: MINIO_ROOT_PASSWORD
            command:
            - /bin/sh
            - -c
            - 'mc alias set local http://raguard-minio:9000 admin "$MINIO_ROOT_PASSWORD" && mc mirror local/data s3/backup'
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-snapshot
  namespace: veritas-rag-production
  labels:
    app.kubernetes.io/name: veritas-rag
    app.kubernetes.io/component: vector-db
    app.kubernetes.io/instance: cronjob-qdrant-snapshot
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: qdrant-curl
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - "curl -X POST http://raguard-qdrant:6333/collections/knowledge/snapshots"
          restartPolicy: OnFailure
