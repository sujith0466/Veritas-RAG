apiVersion: apps/v1
kind: Deployment
metadata:
  name: raguard-api
  namespace: raguard-staging
  labels:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: staging
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: raguard
      app.kubernetes.io/component: backend
      app.kubernetes.io/environment: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raguard
        app.kubernetes.io/component: backend
        app.kubernetes.io/environment: staging
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: api
        image: ghcr.io/your-org/raguard-backend:staging-latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: raguard-config
        - secretRef:
            name: raguard-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10
