apiVersion: v1
kind: Secret
metadata:
  name: raguard-secrets
  namespace: raguard-staging
  labels:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: secrets
    app.kubernetes.io/environment: staging
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # SAFE TEMPLATE PLACEHOLDERS — Do NOT commit real secrets here.
  # In staging deployment pipelines, inject via Vault, AWS Secrets Manager, or SealedSecrets.
  POSTGRES_PASSWORD: "CHANGE_ME_STAGING_PG_PASSWORD"
  SECRET_KEY: "CHANGE_ME_STAGING_JWT_SECRET_KEY_MIN_32_CHARS"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_STAGING_MINIO_ROOT_PASSWORD"
  OPENAI_API_KEY: "CHANGE_ME_STAGING_OPENAI_API_KEY"
