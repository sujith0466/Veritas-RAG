apiVersion: v1
kind: ServiceAccount
metadata:
  name: raguard-chaos-runner
  namespace: raguard-staging
  labels:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: chaos-testing
    app.kubernetes.io/environment: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raguard-chaos-runner-role
  namespace: raguard-staging
  labels:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: chaos-testing
    app.kubernetes.io/environment: staging
rules:
  # Isolated to pods in raguard-staging only — zero cluster-wide or cross-namespace privileges
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "scale"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raguard-chaos-runner-binding
  namespace: raguard-staging
  labels:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: chaos-testing
    app.kubernetes.io/environment: staging
subjects:
  - kind: ServiceAccount
    name: raguard-chaos-runner
    namespace: raguard-staging
roleRef:
  kind: Role
  name: raguard-chaos-runner-role
  apiGroup: rbac.authorization.k8s.io
