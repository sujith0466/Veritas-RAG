apiVersion: v1
kind: Service
metadata:
  name: raguard-api
  namespace: raguard-staging
  labels:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: staging
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: raguard
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: staging
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
