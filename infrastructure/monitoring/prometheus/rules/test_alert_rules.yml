rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # ── 1. SEV-1: ServiceUnavailable Lifecycle Test ────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="raguard-backend"}'
        values: '1+0x2 0+0x5 1+0x5'
    alert_rule_test:
      # Minute 2: Inactive (up == 1)
      - eval_time: 2m
        alertname: ServiceUnavailable
        exp_alerts: []
      # Minute 3: Pending (up == 0 for < 1m)
      - eval_time: 3m
        alertname: ServiceUnavailable
        exp_alerts: []
      # Minute 5: Firing (up == 0 for > 1m)
      - eval_time: 5m
        alertname: ServiceUnavailable
        exp_alerts:
          - exp_labels:
              job: raguard-backend
              severity: SEV-1
              tier: critical
              service: raguard-ai-backend
            exp_annotations:
              summary: "RAGuard AI Backend Service Unavailable"
              description: "RAGuard FastAPI instance is unreachable by Prometheus scraper for > 1 minute."
              runbook_url: "https://docs.raguard.ai/runbooks/service-down"
      # Minute 9: Resolved (up == 1)
      - eval_time: 9m
        alertname: ServiceUnavailable
        exp_alerts: []

  # ── 2. SEV-1: CircuitBreakerTripped Lifecycle Test ─────────────────────────
  - interval: 1m
    input_series:
      - series: 'raguard_errors_total{error_code="CIRCUIT_BREAKER_OPEN",stage="generation"}'
        values: '0+0x2 60+60x5 300+0x5'
    alert_rule_test:
      # Minute 2: Inactive
      - eval_time: 2m
        alertname: CircuitBreakerTripped
        exp_alerts: []
      # Minute 3: Pending (for: 1m)
      - eval_time: 3m
        alertname: CircuitBreakerTripped
        exp_alerts: []
      # Minute 5: Firing
      - eval_time: 5m
        alertname: CircuitBreakerTripped
        exp_alerts:
          - exp_labels:
              severity: SEV-1
              tier: critical
              service: raguard-ai-reliability
            exp_annotations:
              summary: "LLM Circuit Breaker Is OPEN"
              description: "One or more domain circuit breakers are OPEN, rejecting or shedding AI pipeline traffic."
              runbook_url: "https://docs.raguard.ai/runbooks/circuit-breaker"
      # Minute 10: Resolved
      - eval_time: 10m
        alertname: CircuitBreakerTripped
        exp_alerts: []

  # ── 3. SEV-2: ObjectStorageHighFailureRate Lifecycle Test ──────────────────
  - interval: 1m
    input_series:
      - series: 'raguard_storage_failures_total{operation="upload"}'
        values: '0+0x2 600+600x12 7200+0x10'
    alert_rule_test:
      # Minute 2: Inactive (0 failures)
      - eval_time: 2m
        alertname: ObjectStorageHighFailureRate
        exp_alerts: []
      # Minute 4: Pending (rate > 5, but for: 5m not yet elapsed)
      - eval_time: 4m
        alertname: ObjectStorageHighFailureRate
        exp_alerts: []
      # Minute 10: Firing (rate > 5 sustained for > 5m)
      - eval_time: 10m
        alertname: ObjectStorageHighFailureRate
        exp_alerts:
          - exp_labels:
              severity: SEV-2
              tier: major
              service: object-storage
            exp_annotations:
              summary: "Object Storage Elevated Failure Rate"
              description: "MinIO / S3 document storage operations are failing at elevated rates (> 5 failures/sec)."
              runbook_url: "https://docs.raguard.ai/runbooks/storage-failures"
      # Minute 22: Resolved (rate drops to 0)
      - eval_time: 22m
        alertname: ObjectStorageHighFailureRate
        exp_alerts: []

  # ── 4. SEV-3: WorkspaceCleanupFailureDetected Lifecycle Test ───────────────
  - interval: 1m
    input_series:
      - series: 'raguard_workspace_cleanup_failures_total{stage="retention"}'
        values: '0+0x2 10+10x20 200+0x25'
    alert_rule_test:
      # Minute 2: Inactive (0 failures)
      - eval_time: 2m
        alertname: WorkspaceCleanupFailureDetected
        exp_alerts: []
      # Minute 10: Pending (rate > 0, but for: 15m not yet elapsed)
      - eval_time: 10m
        alertname: WorkspaceCleanupFailureDetected
        exp_alerts: []
      # Minute 18: Firing (rate > 0 sustained for 15m)
      - eval_time: 18m
        alertname: WorkspaceCleanupFailureDetected
        exp_alerts:
          - exp_labels:
              severity: SEV-3
              tier: warning
              service: workspace-retention
            exp_annotations:
              summary: "Workspace Cleanup Background Worker Failure"
              description: "One or more soft-deleted workspace purges failed during asynchronous execution."
              runbook_url: "https://docs.raguard.ai/runbooks/workspace-cleanup"
      # Minute 42: Resolved
      - eval_time: 42m
        alertname: WorkspaceCleanupFailureDetected
        exp_alerts: []
