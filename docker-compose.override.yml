# Development overrides — do NOT commit .env values here
version: "3.9"

services:
  api:
    build:
      target: builder
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - app_data:/app/data

  worker:
    build:
      target: builder
    command: watchfiles "celery -A backend.tasks.celery_app worker -l info -Q ingestion,embeddings,retrieval,default -c 2" backend
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - app_data:/app/data

