# Development overrides — do NOT commit .env values here
version: "3.9"

services:
  api:
    build:
      target: builder
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
